server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:myVeryLongAndSecureSecretKeyForJwtTokenGeneration2024!@#$%^&*()}
    access-token-expiration: 3600000   # 1 hour 
    refresh-token-expiration: 604800000   # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://calceiform-gulfy-orval.ngrok-free.dev}
  notifications:
    large-expense-threshold: ${LARGE_EXPENSE_THRESHOLD:5000}
    dashboard-url: ${DASHBOARD_URL:http://localhost:5173/}
  mail:
    from: ${MAIL_FROM:no-reply@expensemanager.local}
  currency:
    base: ${CURRENCY_BASE:INR}
    supported: ${CURRENCY_SUPPORTED:INR,USD,EUR,GBP,AED}
    api-url: ${CURRENCY_API_URL:https://api.exchangerate.host/latest}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.expensemanager: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
